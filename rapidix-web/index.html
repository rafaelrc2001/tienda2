<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Tiñe la barra de estado de Android con el naranja de marca (--orange).
      Va en duro porque el navegador lee esto antes de que exista el CSS: si se
      cambia el token, hay que cambiarlo aquí también.
    -->
    <meta name="theme-color" content="#f57c00" />
    <!-- Las tres familias del mockup: Fraunces, Poppins e Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rapidix</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
